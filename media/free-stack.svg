<text x="60" y="562" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="18" fill="#e6ebff" text-anchor="start" font-weight="700">local-4bit</text>
<text x="220" y="562" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#8793c2" text-anchor="start" font-weight="400">screen the official big checkpoint with full patching, on two consumer GPUs</text>
