<text x="470" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="28" fill="#e6ebff" text-anchor="start" font-weight="700">Your own GPUs</text>
<text x="470" y="246.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" fill="#8793c2" text-anchor="start" font-weight="400">tested on RTX 4070 Super 12 GB + RTX 3060 12 GB</text>
<text x="470" y="268.475" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" fill="#8793c2" text-anchor="start" font-weight="400">full precision up to about 1-2B parameters</text>
<text x="470" y="290.95" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" fill="#8793c2" text-anchor="start" font-weight="400">27B via llama.cpp GGUF or 4-bit</text>
<text x="470" y="352" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="30" fill="#3df5d0" text-anchor="start" font-weight="700">$0</text>
<rect x="848" y="130" width="384" height="250" rx="10" fill="#0e1530" stroke="#1c2750" stroke-width="1.5"/>
