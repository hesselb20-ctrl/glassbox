<text x="220" y="482" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#8793c2" text-anchor="start" font-weight="400">find and verify circuits in small models (GPT-2, Pythia, toy models)</text>
<rect x="1090" y="462" width="142" height="30" rx="15" fill="#0e1530" stroke="#3df5d0" stroke-width="1.5"/>
