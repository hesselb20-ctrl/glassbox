<text x="70" y="352" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="30" fill="#3df5d0" text-anchor="start" font-weight="700">$0 extra</text>
<rect x="448" y="130" width="384" height="250" rx="10" fill="#0e1530" stroke="#1c2750" stroke-width="1.5"/>
