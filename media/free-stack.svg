<text x="870" y="246.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" fill="#8793c2" text-anchor="start" font-weight="400">National Deep Inference Fabric</text>
<text x="870" y="268.475" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" fill="#8793c2" text-anchor="start" font-weight="400">remote execution through nnsight</text>
<text x="870" y="290.95" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15.5" fill="#8793c2" text-anchor="start" font-weight="400">free for research; you sign up for a key</text>
<text x="870" y="352" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="30" fill="#3df5d0" text-anchor="start" font-weight="700">$0</text>
