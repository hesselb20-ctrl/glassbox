<text x="70" y="166" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" fill="#8793c2" text-anchor="start" font-weight="400">SCIENTIST</text>
<text x="70" y="206" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="28" fill="#e6ebff" text-anchor="start" font-weight="700">Claude Code</text>
